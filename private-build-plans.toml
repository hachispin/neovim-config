[buildPlans.IosevkaRain]
family = "Iosevka Rain"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
buildTextureFeature = true

[buildPlans.IosevkaRain.variants.design]
one = "base"
four = "closed-serifless"
six = "closed-contour"
eight = "two-circles"
nine = "closed-contour"
zero = "tall-slashed"
f = "serifed"
g = "double-storey"
y = "cursive-serifless"
braille-dot = "square"
asterisk = "hex-high"
paren = "flat-arc"
brace = "curly-flat-boundary"
percent = "rings-continuous-slash"
bar = "force-upright"
question = "corner"
lig-neq = "more-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"

[buildPlans.IosevkaRain.variants.italic]
f = "extended"
g = "single-storey-serifless"

[buildPlans.IosevkaRain.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaRain.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaRain.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.IosevkaRain.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevkaRain.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaRain.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaRain.ligations]
inherits = "clike"

enables = [
  "html-comment",
  "markdown-checkboxes",
  "minus-minus",
  "tildeeq",
]

disables = [
  "arrow-wave",
  "eqeqeq",
  "exeqeq",
  "trig",
]
